name: Alfresco Java SDK CI

on:
  push:
    branches:
      - develop
      - release/**
      - dev-**
      - fix/**
  pull_request:
    branches:
      - develop
      - release/**
      - dev-**
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch:
    inputs:
      publish_to_maven_central:
        description: "Re-run only the Maven Central publish step for a previously released tag (use to recover from a release workflow whose publish step failed). Requires release_tag."
        type: boolean
        default: false
      release_tag:
        description: "Existing release tag to (re-)publish to Maven Central. Required when publish_to_maven_central is enabled."
        type: string
        required: false

env:
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  AGS_VERSION: 26.2.0.88
  ACS_VERSION: 26.2.0
  GITHUB_EVENT: ${{ github.event_name }}
  BRANCH_NAME: ${{ github.ref_name }}
  # Both variables are required to be set before the release process starts.
  # As the release is triggered by a commit message with "[release]" keyword,
  # setting these variables to new values can be done in the same commit and will indicate the release and the dev versions in it.
  RELEASE_VERSION: "7.3.4-A.1" # The version of the release (tag).
  DEVELOPMENT_VERSION: "7.3.4-A.2-SNAPSHOT" # The version that will be set in pom files after the release (next dev version).

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v15.7.1

  build_and_verify:
    name: "Build and Verify"
    runs-on: ubuntu-latest
    needs:
      - pre-commit
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_CLI_OPTS: >
        source:jar -B -q -e -fae -V -DinstallAtEnd=true -U -Ddoclint=none
        -Dags.version=${AGS_VERSION}
        -Dacs.version=${ACS_VERSION}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v15.7.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v15.7.1
      - name: "Build"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn install $MAVEN_CLI_OPTS -DskipTests=true -Dmaven.javadoc.skip=true
      - name: "Login to quay.io"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: "Start docker compose"
        run: docker compose -f scripts/ci/compose.yaml up -d
      - name: "Run tests"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn verify $MAVEN_CLI_OPTS -Dlogging.root.level=off -Dspring.main.banner-mode=off

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build_and_verify
    outputs:
      release_tag: ${{ env.RELEASE_VERSION }}
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    if: >
      !(failure() || cancelled()) &&
      (github.ref_name == 'develop' || startsWith(github.ref_name, 'release/')) &&
      !contains(github.event.head_commit.message, '[no release]') &&
      github.event_name != 'pull_request' &&
      contains(github.event.head_commit.message, '[release]')
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.21.2
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@v18.21.2
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.21.2
      - name: "Init"
        env:
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: bash ./scripts/ci/init.sh
      - name: "Set release version to ${{ env.RELEASE_VERSION }}"
        run: mvn -B -ntp versions:set -DnewVersion="${{ env.RELEASE_VERSION }}" -DgenerateBackupPoms=false
      - name: "Sync generated REST API client POM versions for release"
        run: |
          find alfresco-acs-java-rest-api/alfresco-acs-java-rest-api-lib/generated -name pom.xml -print0 |
            xargs -0 sed -i "s/${{ env.RELEASE_VERSION }}-SNAPSHOT/${{ env.RELEASE_VERSION }}/g"
      - name: "Deploy release version ${{ env.RELEASE_VERSION }}"
        run: >
          mvn -B -ntp clean deploy -P release
          -Dproject.revision.key=${{ github.sha }}
          -DskipTests
          -DbuildNumber=${{ github.run_number }}
          -Dags.version=${{ env.AGS_VERSION }}
          -Dacs.version=${{ env.ACS_VERSION }}
      - name: "Commit release version ${{ env.RELEASE_VERSION }}"
        uses: iarekylew00t/verified-bot-commit@33985d44b7719dcaf0b854a0f4b0caad9bdc5b86 # v2.3.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          files: |
            pom.xml
            **/pom.xml
          message: "[skip ci] Release version ${{ env.RELEASE_VERSION }}"
      - name: "Tag release version ${{ env.RELEASE_VERSION }}"
        run: |
          git tag "${{ env.RELEASE_VERSION }}"
          git push origin "${{ env.RELEASE_VERSION }}"
      - name: "Set next development version to ${{ env.DEVELOPMENT_VERSION }}"
        run: mvn -B -ntp versions:set -DnewVersion="${{ env.DEVELOPMENT_VERSION }}" -DgenerateBackupPoms=false
      - name: "Sync generated REST API client POM versions for next development"
        run: |
          find alfresco-acs-java-rest-api/alfresco-acs-java-rest-api-lib/generated -name pom.xml -print0 |
            xargs -0 sed -i "s/${{ env.RELEASE_VERSION }}/${{ env.DEVELOPMENT_VERSION }}/g"
      - name: "Commit next development version ${{ env.DEVELOPMENT_VERSION }}"
        uses: iarekylew00t/verified-bot-commit@33985d44b7719dcaf0b854a0f4b0caad9bdc5b86 # v2.3.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          files: |
            pom.xml
            **/pom.xml
          message: "[skip ci] Prepare next development version ${{ env.DEVELOPMENT_VERSION }}"

  publish_to_maven_central:
    name: "Publish to Maven Central"
    runs-on: ubuntu-latest
    if: >
      !(failure() || cancelled()) &&
      (
        (
          (github.ref_name == 'develop' || startsWith(github.ref_name, 'release/')) &&
          contains(github.event.head_commit.message, '[publish]') &&
          github.event_name != 'pull_request'
        ) ||
        inputs.publish_to_maven_central
      )
    needs:
      - release
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.release_tag || needs.release.outputs.release_tag }}
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v15.7.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v15.7.1
      - name: "Install Maven settings"
        run: |
          mkdir -p ~/.m2
          cp .ci.settings.xml ~/.m2/settings.xml
      - name: "Import GPG key"
        uses: Alfresco/alfresco-build-tools/.github/actions/import-gpg-key@v18.7.0
        with:
          gpg-signing-private-key: ${{ secrets.GPG_SIGNING_PRIVATE_KEY }}
          gpg-signing-passphrase: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
      - name: "Publish to Maven Central"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: |
          mvn --batch-mode -P sdk-release -pl '!samples,!samples/extension-template,!samples/event-api-handlers,!samples/event-api-spring-integration,!samples/oauth2-feign-sample,!integration-tests' clean package gpg:sign org.sonatype.central:central-publishing-maven-plugin:publish -DskipTests=true -Dgpg.passphrase="$GPG_SIGNING_PASSPHRASE"
