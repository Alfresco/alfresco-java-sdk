name: Alfresco Java SDK CI

on:
  push:
    branches:
      - develop
      - release/**
      - dev-**
      - fix/**
  pull_request:
    branches:
      - develop
      - release/**
      - dev-**
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch:
    inputs:
      publish_to_maven_central:
        description: "Re-run only the Maven Central publish step for a previously released tag (use to recover from a release workflow whose publish step failed). Requires release_tag."
        type: boolean
        default: false
      release_tag:
        description: "Existing release tag to (re-)publish to Maven Central. Required when publish_to_maven_central is enabled."
        type: string
        required: false

env:
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  AGS_VERSION: 26.2.0.88
  ACS_VERSION: 26.2.0
  GITHUB_EVENT: ${{ github.event_name }}
  BRANCH_NAME: ${{ github.ref_name }}
  # Both variables are required to be set before the release process starts.
  # As the release is triggered by a commit message with "[release]" keyword,
  # setting these variables to new values can be done in the same commit and will indicate the release and the dev versions in it.
  RELEASE_VERSION: "7.3.4-A.4" # The version of the release (tag).
  DEVELOPMENT_VERSION: "7.3.4-A.5-SNAPSHOT" # The version that will be set in pom files after the release (next dev version).

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1

  build_and_verify:
    name: "Build and Verify"
    runs-on: ubuntu-latest
    needs:
      - pre-commit
    permissions:
      id-token: write
      contents: read
    env:
      MAVEN_CLI_OPTS: >
        source:jar -B -q -e -fae -V -DinstallAtEnd=true -U -Ddoclint=none
        -Dags.version=${AGS_VERSION}
        -Dacs.version=${ACS_VERSION}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Build"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn install $MAVEN_CLI_OPTS -DskipTests=true -Dmaven.javadoc.skip=true
      - name: "Login to quay.io"
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: "Start docker compose"
        run: docker compose -f scripts/ci/compose.yaml up -d
      - name: "Run tests"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn verify $MAVEN_CLI_OPTS -Dlogging.root.level=off -Dspring.main.banner-mode=off

  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    needs:
      - build_and_verify
    outputs:
      release_tag: ${{ env.RELEASE_VERSION }}
    if: >
      !(failure() || cancelled()) &&
      (github.ref_name == 'develop' || startsWith(github.ref_name, 'release/')) &&
      !contains(github.event.head_commit.message, '[no release]') &&
      github.event_name != 'pull_request' &&
      contains(github.event.head_commit.message, '[release]')
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: bash ./scripts/ci/init.sh
      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ env.RELEASE_VERSION }}
          development-version: ${{ env.DEVELOPMENT_VERSION }}
          maven-args: >
            -DskipTests
            -DbuildNumber=${{ github.run_number }}
            -Dags.version=${{ env.AGS_VERSION }}
            -Dacs.version=${{ env.ACS_VERSION }}
            -pl '!samples,!samples/extension-template,!samples/event-api-handlers,!samples/event-api-spring-integration,!samples/oauth2-feign-sample,!integration-tests'

  publish_to_maven_central:
    name: "Publish to Maven Central"
    runs-on: ubuntu-latest
    if: >
      !(failure() || cancelled()) &&
      (
        (
          (github.ref_name == 'develop' || startsWith(github.ref_name, 'release/')) &&
          contains(github.event.head_commit.message, '[publish]') &&
          github.event_name != 'pull_request'
        ) ||
        inputs.publish_to_maven_central
      )
    needs:
      - release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || needs.release.outputs.release_tag }}
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Install Maven settings"
        run: |
          mkdir -p ~/.m2
          cp .ci.settings.xml ~/.m2/settings.xml
      - name: "Import GPG key"
        uses: Alfresco/alfresco-build-tools/.github/actions/import-gpg-key@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
        with:
          gpg-signing-private-key: ${{ secrets.GPG_SIGNING_PRIVATE_KEY }}
          gpg-signing-passphrase: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
      - name: "Publish to Maven Central"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: |
          mvn --batch-mode -P sdk-release -pl '!samples,!samples/extension-template,!samples/event-api-handlers,!samples/event-api-spring-integration,!samples/oauth2-feign-sample,!integration-tests' clean package gpg:sign org.sonatype.central:central-publishing-maven-plugin:publish -DskipTests=true -Dgpg.passphrase="$GPG_SIGNING_PASSPHRASE"
