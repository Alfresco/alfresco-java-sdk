name: Alfresco Java SDK CI

on:
  push:
    branches:
      - develop
      - release/**
      - dev-**
      - fix/**
  pull_request:
    branches:
      - develop
      - release/**
      - dev-**
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch:
    inputs:
      publish_to_maven_central:
        description: "Run the Maven Central publish job (requires release_tag when enabled)"
        type: boolean
        default: false
      release_tag:
        description: "Release tag to publish to Maven Central (required when publish_to_maven_central is true)"
        type: string
        required: false

env:
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  AGS_VERSION: 26.2.0.88
  ACS_VERSION: 26.2.0
  GITHUB_EVENT: ${{ github.event_name }}
  BRANCH_NAME: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v15.7.1

  build_and_verify:
    name: "Build and Verify"
    runs-on: ubuntu-latest
    needs:
      - pre-commit
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_CLI_OPTS: >
        source:jar -B -q -e -fae -V -DinstallAtEnd=true -U -Ddoclint=none
        -Dags.version=${AGS_VERSION}
        -Dacs.version=${ACS_VERSION}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v15.7.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v15.7.1
      - name: "Build"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn install $MAVEN_CLI_OPTS -DskipTests=true -Dmaven.javadoc.skip=true
      - name: "Login to quay.io"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: "Start docker compose"
        run: docker compose -f scripts/ci/compose.yaml up -d
      - name: "Run tests"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn verify $MAVEN_CLI_OPTS -Dlogging.root.level=off -Dspring.main.banner-mode=off

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build_and_verify
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    if: >
      !(failure() || cancelled()) &&
      (github.ref_name == 'develop' || startsWith(github.ref_name, 'release/')) &&
      !contains(github.event.head_commit.message, '[no release]') &&
      github.event_name != 'pull_request' &&
      contains(github.event.head_commit.message, '[release]')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v15.7.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@v15.7.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v15.7.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/configure-git-author@v15.7.1
        with:
          username: ${{ vars.BOT_GITHUB_USERNAME }}
          email: ${{ vars.BOT_GITHUB_EMAIL }}
          global: true
      - name: "Init"
        env:
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: bash ./scripts/ci/init.sh
      - name: "Release"
        env:
          GIT_USERNAME: ${{ vars.BOT_GITHUB_USERNAME }}
          GIT_PASSWORD: ${{ secrets.BOT_GITHUB_TOKEN }}
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: |
          bash ./scripts/ci/verify_release_tag.sh
          bash ./scripts/ci/maven_release.sh
      - name: "Capture release tag"
        id: release_tag
        run: echo "release_tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

  publish:
    name: "Publish"
    runs-on: ubuntu-latest
    if: >
      (github.ref_name == 'develop' || startsWith(github.ref_name, 'release/')) &&
      contains(github.event.head_commit.message, '[publish]') &&
      github.event_name != 'pull_request'
    needs:
      - release
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_CLI_OPTS: >
        source:jar -B -q -e -fae -V -DinstallAtEnd=true -U -Ddoclint=none
        -DaltReleaseDeploymentRepository=alfresco-public::default::https://artifacts.alfresco.com/nexus/content/repositories/releases
        -DaltSnapshotDeploymentRepository=alfresco-public-snapshots::default::https://artifacts.alfresco.com/nexus/content/repositories/snapshots
        -Dags.version=${AGS_VERSION}
        -Dacs.version=${ACS_VERSION}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v15.7.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v15.7.1
      - name: "Publish artifacts"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn deploy $MAVEN_CLI_OPTS -DskipTests=true

  publish_to_maven_central:
    name: "Publish to Maven Central"
    runs-on: ubuntu-latest
    if: >
      !(failure() || cancelled()) &&
      (
        (
          (github.ref_name == 'develop' || startsWith(github.ref_name, 'release/')) &&
          contains(github.event.head_commit.message, '[publish]') &&
          github.event_name != 'pull_request'
        ) ||
        inputs.publish_to_maven_central
      )
    needs:
      - release
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - name: "Validate inputs"
        if: inputs.publish_to_maven_central
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "::error::release_tag input is required when publish_to_maven_central is true"
            exit 1
          fi
          if ! gh api "repos/${{ github.repository }}/git/refs/tags/${{ inputs.release_tag }}" --silent 2>/dev/null; then
            echo "::error::release_tag '${{ inputs.release_tag }}' does not exist as a tag in this repository (or the API call failed)"
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.release_tag || needs.release.outputs.release_tag }}
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v15.7.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v15.7.1
      - name: "Install Maven settings"
        run: |
          mkdir -p ~/.m2
          cp .ci.settings.xml ~/.m2/settings.xml
      - name: "Import GPG key"
        uses: Alfresco/alfresco-build-tools/.github/actions/import-gpg-key@v18.7.0
        with:
          gpg-signing-private-key: ${{ secrets.GPG_SIGNING_PRIVATE_KEY }}
          gpg-signing-passphrase: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
      - name: "Publish to Maven Central"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: |
          mvn --batch-mode -P sdk-release -pl '!samples,!samples/extension-template,!samples/event-api-handlers,!samples/event-api-spring-integration,!samples/oauth2-feign-sample,!integration-tests' clean package gpg:sign org.sonatype.central:central-publishing-maven-plugin:publish -DskipTests=true -Dgpg.passphrase="$GPG_SIGNING_PASSPHRASE"
